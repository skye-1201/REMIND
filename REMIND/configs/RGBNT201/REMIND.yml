MODEL:
  TRANSFORMER_TYPE: ViT-B-16
  STRIDE_SIZE:
  - 16
  - 16
  SIE_CAMERA: true
  DIRECT: 1
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  GLOBAL_LOCAL: false
  HDM: false
  ATM: false
  HEAD: 4
  FEAT_DIM: 768
INPUT:
  SIZE_TRAIN:
  - 256
  - 128
  SIZE_TEST:
  - 256
  - 128
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
DATALOADER:
  SAMPLER: softmax_triplet
  NUM_INSTANCE: 8
  NUM_WORKERS: 14
DATASETS:
  NAMES: ('RGBNT201')
  ROOT_DIR: /data/datasets/
SOLVER:
  BASE_LR: 0.00035
  WARMUP_ITERS: 10
  MAX_EPOCHS: 50
  OPTIMIZER_NAME: Adam
  IMS_PER_BATCH: 64
  EVAL_PERIOD: 1
  SEED: 1201
  CLIP_BACKBONE_LR: 5.0e-06
  IMAGENET_BACKBONE_LR_FACTOR: 0.8
  AMP_ENABLED: true
TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: before
  FEAT_NORM: 'yes'
  MISS: ''
  RATIO: 0.9
  MAX_RANK: 50
  WEIGHT_PATH: ./outputs/RGBNT201/REMINDbest.pth
  MEMORY_PATH: ./outputs/RGBNT201/REMINDmemory.pth
  MEMORY_N: 40
  MEMORY_SUBSET: random
  MEMORY_SEED: 1201
  LATENCY_WARMUP_CALLS: 10
  LATENCY_MAX_RECORD_CALLS: 0
OUTPUT_DIR: ./outputs/RGBNT201
SAVE_LIST:
- modeling/make_model.py
- engine/processor.py
- engine/remind_losses.py
REMIND:
  DMC:
    COMMON_DROPOUT: 0.1
    COMMON_HEADS: 4
    SPECIFIC_PROMPT_ATTN_DROPOUT: 0.0
    SPECIFIC_PROMPT_DROPOUT: 0.0
    SPECIFIC_PROMPT_DROP_PATH: 0.1
    SPECIFIC_PROMPT_HEADS: 16
    SPECIFIC_PROMPT_MLP_RATIO: 4.0
    SPECIFIC_PROMPT_QKV_BIAS: false
    SPECIFIC_PROMPT_QK_SCALE: 0.0
    VARIANCE_EPS: 1.0e-09
  LOSS:
    COMMON_MARGIN: 3.0
    COMMON_MARGIN_WEIGHT: 1.0
    COMMON_MSE_WEIGHT: 1.0
    GLOBAL_WEIGHT: 1.0
    RECON_FEATURE_WEIGHT: 1.0
    RECON_ID_WEIGHT: 1.0
    SPECIFIC_LOSS_END_EPOCH: 3
    SPECIFIC_WEIGHT: 0.1
  MEMORY:
    MOMENTUM: 0.4
    WARMUP_EPOCHS: 1
  RMR:
    AUG_MODE: noise
    AUG_NOISE_STD: 0.02
    AUG_RATIO: 0.1
    EXPERT_DROPOUT: 0.0
    EXPERT_MLP_RATIO: 4.0
    NUM_EXPERTS: 5
    RETRIEVAL_TOPK: 5
